[project]
name = "haqwa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "WyneZ", email = "wynekyawhan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.25.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
demo = [
    "agentproof-sim==0.1.1",
    "google-adk==2.9.2",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
